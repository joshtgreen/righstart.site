<?xml version="1.0" encoding="UTF-8"?>
<!--
  DESIGN-4187-R3. A PDF-safe, navy-ink derivative of public/wageproof-white.svg
  — the site's REAL wordmark (components/marketing/MarketingNav.tsx renders
  this exact file), a hand-drawn vector logotype: the icon (six gradient
  shapes) plus "WageProof" set as drawn letterform PATHS, not CSS type. Josh,
  round 3: "Why didn't you use WageProof's actual word mark? Use that
  instead" — round 2 used DM Serif Display TYPE for the cover's icon+name
  lockup because its own research said no navy-ink version of this asset
  existed; re-checked for round 3, and a navy-ink derivative is exactly one
  fill swap away.

  TWO CHANGES from the source, both mechanical:

  1. THE ONE COLOUR CHANGE Josh asked for. The source's name layer is `.cls-2
     { fill: #fff }` — white, for the navy marketing nav bar. This derivative
     recolours ONLY that class to the navy token (`#1a2744`) for white paper.
     The icon's six gradient classes (`.cls-1`/`.cls-4`/`.cls-5`/`.cls-6`/
     `.cls-7`/`.cls-8` — `#0a9da5`/`#0095f2`/`#00cfad`/`#2448f8`/`#0cf`/
     `#2cb8ad`) are UNTOUCHED — same hex values, same shapes, same paths.

  2. FLATTENED FOR @REACT-PDF/SVG, same technique as public/wageproof-icon-pdf.svg's
     own header explains: @react-pdf/svg (node_modules/@react-pdf/svg/lib/index.js,
     parseStyleAttribute/convertAttributes) reads an element's own `style="..."`
     ATTRIBUTE only — it has no CSS class-selector resolution, so a
     <path class="cls-2"> whose colour lives in a sibling <defs><style>
     block renders with NO fill at all (confirmed empirically against the
     unmodified source: a blank/invisible Image, no error). Each shape's
     `class="cls-N"` is moved to an inline `fill="..."` attribute and the
     `<defs><style>` block is dropped. No `<text>` element existed to worry
     about either way — the name was already paths in the source.

  SAME viewBox as the source (`20 68 120 24`, width 120 / height 24, a 5:1
  aspect ratio) — used VERBATIM, not re-centred or re-scaled, so this is a
  literal recolour-and-flatten of the site's own asset, never an independent
  redraw. If public/wageproof-white.svg is ever regenerated, re-derive this
  file from it the same way — do not hand-edit the paths independently of
  the source.
-->
